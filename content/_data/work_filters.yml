  summary: >-
    Developing cultural projects with others, from preparing exhibitions and events to coordinating workshops, welcoming
    participants and supporting accessible learning.
  description: |-
    I help turn artistic ideas into projects people can take part in. Working with artists, organisers and community groups, I contribute to planning, preparing spaces, coordinating activities and welcoming participants. My experience spans exhibition installation, festival operations, collaborative workshops and accessible learning materials.

    I pay attention to the conditions that make participation possible: clear information, shared responsibilities and room for different needs. This connects my work with [Atmosphere Collective](/work/atmosfera/), community activities at [Illutron](/work/illutron/) and inclusive programmes with [Blindmotion](/work/blindmotion/).
- id: art-research
  label: Art & Research
  tags:
  - artwork
  - research
  - performance
  - installation
  summary: Exploring bodies, care and digital life through installations, performance, drawing and material experiments that invite people to look, reflect and take part.
  description: |-
    My artistic practice asks how bodies, images and technologies shape the ways we experience ourselves and relate to others. I work through drawing, printmaking, photographic performance, poetry and installation, developing ideas through material experiments and encounters with people.

    In [Body.Interface](/work/body-interface/), performance and image-making explore bodily presence in digital environments. [Human Warmth](/work/human-warmth/) translates the visual language of clinical equipment into a sculpture about care, while [Care Lab](/work/care-lab/) invites visitors to reflect, label and print their responses. Across these works, making and participation are ways of asking questions.
- id: design-communication
  label: Design & Communication
  tags:
  - design
  - communication
  - video
  - strategy
  summary: Giving projects a clear public form through visual identities, editorial content, film editing and communication materials for print, websites and social media.
  description: |-
    I translate a project's purpose into visual and written communication that people can recognise and understand. My work includes identity guidelines, editorial layouts, campaign materials, website content and audiovisual editing. I develop a consistent language across formats, adapting it to the audience and the information they need.

    This can mean expressing a brand's character through colour and pattern, as in [Morhaven](/portfolio/morhaven/), making public information accessible for [Alta Gracia](/portfolio/alta-gracia/), or creating invitations and recruitment materials for [Illutron](/work/illutron/). Communication is part of how a project meets its public and makes participation possible.
