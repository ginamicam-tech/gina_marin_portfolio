title: Gina Marín
description: Creative strategy, communication and cultural projects.
email: ginamicam@gmail.com
location: Copenhagen, Denmark
url: "https://ginamicam-tech.github.io"
baseurl: "/gina_marin_portfolio"
lang: en
timezone: Europe/Copenhagen
markdown: kramdown
collections_dir: content
data_dir: content/_data
permalink: pretty
collections:
  pages:
    output: true
  work:
    output: true
    permalink: /work/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: work
    values:
      layout: work
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
