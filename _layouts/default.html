<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true">*</span></a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == '/work/' and page.collection == 'work' %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
    <footer class="site-footer wrap">
      <span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span>
      <span>{{ site.location | escape }}</span>
      <a href="mailto:{{ site.email }}">Get in touch ↗</a>
    </footer>
  </body>
</html>
