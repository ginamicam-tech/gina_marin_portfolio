intro: I am an artist and creative practitioner from Argentina, based in Copenhagen. My practice grows
  through the dialogue between artistic research, cultural production and visual communication. I work
  with bodies, images and materials, connecting hands-on experimentation with collaboration and the conditions
  that make participation possible.
